[package]
name = "helloworld"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.9", features = ["defmt", "arch-cortex-m", "executor-thread"]}
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-usb = {version = "0.5.0"}

defmt-embassy-usbserial = "0.2.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m-rt = "0.7.5"

static_cell = "2.1"
portable-atomic = { version = "1.14", features = ["critical-section"] }


defmt = "1.1.1"
defmt-rtt = "1.3.0"

